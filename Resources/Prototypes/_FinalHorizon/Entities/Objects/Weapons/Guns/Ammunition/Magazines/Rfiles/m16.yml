- type: entity
  parent: BaseItem
  id: FHMagazineRifleM16
  name: STANAG 30-Round magazine
  description: A aluminum magazine made for the NATO STANdardization AGreement 4179, made to fit across various NATO rifles.
  components:
  - type: Tag
    tags:
      - Magazine556
      - MagazineLightRifle
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    soundInsert:
      path: /Audio/_FinalHorizon/Weapons/Guns/Misc/rifle_load.ogg
      params:
        variation: 0.1
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge556
    capacity: 30
    fillDelay: 0.30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Ammunition/Magazine/Rifles/m16.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: FHMagazineRifleM16
  id: FHMagazineRifleM16Full
  suffix: Full
  components:
  - type: BallisticAmmoProvider
    proto: FHCartridge556
