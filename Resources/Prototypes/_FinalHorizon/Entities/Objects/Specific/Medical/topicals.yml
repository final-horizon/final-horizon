- type: entity
  name: blood pack
  description: Contains a groundbreaking universal blood replacement created by Nanotrasen's advanced medical science.
  parent: FHBaseHealingItem
  id: FHBloodpack
  suffix: Full
  components:
  - type: Item
    heldPrefix: bloodpack
  - type: Tag
    tags:
    - Bloodpack
    - FHMedical
  - type: Sprite
    state: bloodpack
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Bloodloss: -0.5 #lowers bloodloss damage
    modifyBloodLevel: 15 #restores about 5% blood per use on standard humanoids.
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: FHBloodpack
    count: 10
  - type: StackPrice
    price: 10

- type: entity
  parent: FHBloodpack
  id: FHBloodpack1
  suffix: Single
  components:
  - type: Stack
    stackType: FHBloodpack
    count: 1

- type: entity
  parent: FHBaseHealingItem
  id: FHTourniquet
  name: tourniquet
  description: Stops bleeding! Hopefully.
  components:
    - type: Tag
      tags:
        - SecBeltEquip
        - Tourniquet
        - FHMedical
    - type: Sprite
      state: tourniquet
    - type: Item
      heldPrefix: tourniquet
      size: Tiny
    - type: Healing
      damageContainers:
        - Biological
      damage:
        types:
          Blunt: -5 # Tourniquets HURT
          Asphyxiation: 5 # Essentially Stopping all blood reaching a part of your body
      bloodlossModifier: -10 # Tourniquets stop bleeding
      delay: 0.5
      healingBeginSound:
        path: "/Audio/Items/Medical/brutepack_begin.ogg"
        params:
          volume: 1.0
          variation: 0.125
      healingEndSound:
        path: "/Audio/Items/Medical/brutepack_end.ogg"
        params:
          volume: 1.0
          variation: 0.125

