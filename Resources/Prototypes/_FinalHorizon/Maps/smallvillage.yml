- type: gameMap
  id: SmallVillage
  mapName: Small Village
  mapPath: /Maps/_FinalHorizon/smallvillage.yml
  minPlayers: 0
  maxPlayers: 60
  stations:
    SmallVillage:
      stationProto: FinalHorizonStation
      components:
        - type: MetaData
          name: Small Village
        - type: StationJobs
          availableJobs:
            USMCPlatoonLeader: [ 1, 1 ]
            USMCTeamLeader: [ 4, 4 ]
            USMCMedic: [ 4, 4 ]
            USMCMachineGunner: [ 4, 4 ]
            USMCRifleMan: [ 40, 40 ]
            USSRPlatoonLeader: [ 1, 1 ]
            USSRTeamLeader: [ 4, 4 ]
            USSRMedic: [ 4, 4 ]
            USSRMachineGunner: [ 4, 4 ]
            USSRRifleMan: [ 40, 40 ]
        - type: MultiMapLoader
          maps: [ "/Maps/_FinalHorizon/Bases/usmc.yml", "/Maps/_FinalHorizon/Bases/ussr.yml" ]
        - type: StationRoster
          startingRosters:
            - USMC
            - SovietArmy

- type: roster
  id: USMC
  roster:
    name: "United States Marine Corp"
    squads:
      - name: "Alpha Squad"
        slots:
          - job: USMCRifleMan
          - job: USMCRifleMan
      - name: "Bravo Squad"
        slots:
          - job: USMCRifleMan
          - job: USMCRifleMan

- type: roster
  id: SovietArmy
  roster:
    name: "Soviet Army"
    squads:
      - name: "Apple Squad"
        slots:
          - job: USSRRifleMan
          - job: USSRRifleMan
      - name: "Butter Squad"
        slots:
          - job: USSRRifleMan
          - job: USSRRifleMan
