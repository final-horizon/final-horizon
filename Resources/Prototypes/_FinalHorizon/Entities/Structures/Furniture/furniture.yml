- type: entity
  id: FHDrawer
  parent: BaseStructure
  name: drawer
  components:
  - type: Sprite
    sprite: _FinalHorizon/Structures/Furniture/furniture.rsi
    state: drawer
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

