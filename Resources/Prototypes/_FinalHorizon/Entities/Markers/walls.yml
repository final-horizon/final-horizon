# Spawn protection
- type: entity
  id: FHSpawnProtectionBluFor
  parent: MarkerBase
  name: spawn protection wall
  suffix: blufor
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - BluFor
        layer:
        - BluFor
        density: 1000
  - type: Physics
    bodyType: Static
  - type: Sprite
    state: blue

