- type: entity
  name: M21
  parent: FHWeaponBaseSniper
  id: FHWeaponSnipersM21
  description: The US military standard issue marksman rifle. The M21 is a accurized semi-auto M14, it was developed and adopted in 1969 to replace the M14 marksman rifle.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Snipers/m21.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Huge
    shape:
    - 0,0,3,2
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/Snipers/m21.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/_FinalHorizon/Weapons/Guns/Gunshots/m14.ogg
      params:
        variation: 0.1
        volume: -2
    soundEmpty:
      path: /Audio/_FinalHorizon/Weapons/Guns/Empty/gen_empty.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
    canActivateInhand: false
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_FinalHorizon/Weapons/Guns/MagIn/m16_magin.ogg
        ejectSound: /Audio/_FinalHorizon/Weapons/Guns/MagOut/m16_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine762x51
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - Cartridge762x51
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
    appearanceDataInit:
     enum.AmmoVisuals.MagLoaded: false
  - type: FarGunshot
    range: 260
    sound: /Audio/_FinalHorizon/Weapons/Guns/Far/toz194_dist.ogg
