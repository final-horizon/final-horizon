- type: entity
  abstract: true
  parent: Clothing
  id: FHClothingPouchBase
  components:
  - type: EmitSoundOnPickup
    sound:
      collection: GearPickup
      params:
        volume: 200 #help me
  - type: Sprite
    state: icon
  - type: Item
    size: Ginormous
  - type: Clothing
    slots: [beltpouch]
    equipSound:
      collection: GearPickup
      params:
        volume: 10
        variation: 0.1
    quickEquip: false
  - type: Storage
    maxItemSize: Normal
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,7,1
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
