    containers:
      storagebase: !type:AllSelector
        children:
        - id: FHMagazineLMGPKMFull
        - id: FHMagazineLMGPKMFull
        - id: FHMagazineLMGPKMFull
        - id: FHMagazineLMGPKMFull

- type: entity
  parent: FHClothingBackpackBase
  id: FHClothingBackpackNVARPG
  name: Nationale Volksarmee RPG Bag
  description: A backpack that holds 3 RPG rockets. You're pretty sure this is just a Soviet rocket bag.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Clothing/Back/soviet_rpg.rsi
  - type: Storage
    grid:
    - 0,0,0,2
    - 2,0,2,2
    - 4,0,4,2
    maxItemSize: Huge
    whitelist:
      tags:
      - CartridgeRocket

- type: entity
  parent: FHClothingBackpackNVARPG
  id: FHClothingBackpackNVARPGFilled
  suffix: filled, rpg7
  components:
