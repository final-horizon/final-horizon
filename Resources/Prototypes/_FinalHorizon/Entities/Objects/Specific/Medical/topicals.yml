    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: FHMesh
    count: 10
  - type: StackPrice
    price: 20

- type: entity
  id: FHMesh1
  parent: FHMesh
