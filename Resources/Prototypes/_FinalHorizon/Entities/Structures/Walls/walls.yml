- type: entity
  parent: BaseWall
  id: FHWallTent
  name: tent wall
  components:
  - type: Sprite
    sprite: _FinalHorizon/Structures/Walls/tent.rsi
    color: "#5a7252"
  - type: Icon
    sprite: _FinalHorizon/Structures/Walls/tent.rsi
    color: "#5a7252"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: tent

- type: entity
  parent: BaseWall
  id: FHWallConcrete
  name: concrete wall
  components:
  - type: Sprite
    sprite: _FinalHorizon/Structures/Walls/concrete.rsi
  - type: Icon
    sprite: _FinalHorizon/Structures/Walls/concrete.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: concrete

- type: entity
  parent: BaseWall
  id: FHWallRockIndestructible
  name: rock wall
  suffix: indestructible
  components:
  - type: Sprite
    sprite: Structures/Walls/rock.rsi
    state: rock_asteroid
  - type: Icon
    sprite: Structures/Walls/rock.rsi
    state: rock_asteroid
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 4000
