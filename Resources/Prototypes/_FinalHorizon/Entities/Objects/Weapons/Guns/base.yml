- type: entity
  parent: BaseItem
  abstract: true
  id: FHWeaponBase
  components:
  - type: Wieldable
  - type: WieldableDoAfter
    timer: 0.4
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -30
  - type: Gun
    minAngle: 21
    maxAngle: 32
    soundEmpty:
      path: /Audio/_FinalHorizon/Weapons/Guns/Empty/gen_empty.ogg
  - type: SpeedModifiedOnWield
    walkModifier: 0.8
    sprintModifier: 0.8

- type: entity
  parent: BaseItem
  id: FHWeaponLauncherBase
  components:
  - type: HeldSpeedModifier
    walkModifier: 0.6
    sprintModifier: 0.6
