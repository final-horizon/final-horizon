- type: entity
  parent: BaseItem
  id: FHShovelNato
  suffix: NATO
  name: Shovel
  description: A large tool for digging and moving dirt.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Tools/spade_nato.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: 45
    damage:
      types:
        Blunt: 20
    soundHit:
      collection: MetalThud
  - type: Item
    size: Large
    sprite: _FinalHorizon/Objects/Tools/spade_nato.rsi
  - type: Shovel
  - type: Tool
    qualities:
      - Digging
    useSound:
      path: /Audio/Items/shovel_dig.ogg
  - type: ToolTileCompatible
    delay: 2
  - type: Tag
    tags:
    - FHUtilityItem

