- type: entity
  id: ActionToggleScope
  categories: [ HideSpawnMenu ]
  name: Use Iron Sights
  description: Aim down your iron sights.
  components:
  - type: Action
    icon:
      sprite: _RMC14/Actions/scope_actions.rsi
      state: sniperscope
    useDelay: 0.5
  - type: InstantAction
    event: !type:ToggleActionEvent

- type: entity
  id: ActionCycleZoomLevel
  categories: [ HideSpawnMenu ]
  name: Cycle Zoom Level
  description: Change the level of magnification of your optics.
  components:
  - type: Action
    icon:
      sprite: _RMC14/Actions/scope_actions.rsi
      state: sniperscope
    useDelay: 0.5
  - type: InstantAction
    event: !type:ScopeCycleZoomLevelEvent
  - type: Tag
    tags:
    - ActionCycleZoomLevel

- type: Tag
  id: ActionCycleZoomLevel
