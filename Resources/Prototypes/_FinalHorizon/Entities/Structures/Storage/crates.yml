- type: entity
  parent: BaseStructureDynamic
  id: FHCrateWood
  name: wood crate
  description: A large container for items.
  components:
  - type: Animateable
  - type: Transform
    noRot: true
  - type: Icon
    sprite: _FinalHorizon/Structures/Storage/Crates/wood.rsi
    state: closed
  - type: Sprite
    noRot: true
    sprite: _FinalHorizon/Structures/Storage/Crates/wood.rsi
    layers:
    - state: closed
      map: ["enum.StorageVisualLayers.Base"]
    - state: open
      map: ["enum.StorageVisualLayers.Door"]
  - type: InteractionOutline
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.29"
        density: 50
        mask:
        - CrateMask
        layer:
        - MachineLayer
  - type: EntityStorage
  - type: PlaceableSurface
    isPlaceable: false # defaults to closed.
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: EntityStorageVisuals
    stateDoorOpen: open
    stateDoorClosed: closed
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
      paper_label: !type:ContainerSlot
  - type: RequireProjectileTarget
  - type: Appearance

