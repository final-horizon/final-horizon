- type: entity
  parent: BaseItem
  id: FHMagazineRifleAK74Black
  name: AK-74 Black Magazine (30)
  components:
  - type: Tag
    tags:
      - Magazine545
      - MagazineLightRifle
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge545
    capacity: 30
    fillDelay: 0.30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Ammunition/Magazine/Rifles/ak74black.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: FHMagazineRifleAK74Black
  id: FHMagazineRifleAK74Bakelite
  name: AK-74 Bakelite Magazine (30)
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Ammunition/Magazine/Rifles/ak74bake.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
