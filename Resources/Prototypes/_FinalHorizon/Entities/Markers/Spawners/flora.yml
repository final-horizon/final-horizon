- type: entity
  parent: DecalSpawnerBase
  id: FHDecalSpawnerGrassTemperate
  suffix: temperate grass
  components:
  - type: Sprite
    layers:
    - state: green
    - state: decal
  - type: RandomDecalSpawner
    radius: 0
    zIndex: 5
    deleteSpawnerAfterSpawn: true
    decals:
    - FHMineStick
    - Grassd1
    - Grassd2
    - Grassd3
    - FHGrassTall1
    - FHGrassTall2
    - FHGrassTall3
    - FHGrassTall4
