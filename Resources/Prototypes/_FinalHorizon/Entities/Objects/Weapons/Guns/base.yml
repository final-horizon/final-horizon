- type: entity
  parent: BaseItem
  abstract: true
  id: FHWeaponBase
  components:
  - type: Wieldable
  - type: WieldableDoAfter
    timer: 0.3
  - type: GunWieldBonus
    minAngle: -46
    maxAngle: -46
    angleIncrease: 0
    angleDecay: 0
  - type: Gun
    minAngle: 50
    maxAngle: 50
    angleIncrease: 2.5
    angleDecay: 8
