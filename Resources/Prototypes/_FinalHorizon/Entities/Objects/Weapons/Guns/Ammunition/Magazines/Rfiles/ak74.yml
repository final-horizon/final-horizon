- type: entity
  parent: BaseItem
  id: FHMagazineRifleAK74Black
  name: 6L23 30-Round magazine
  description: A polymer magazine made for the AK-74 rifle. Made out of a higher strenght poylmer than the 6L20 magazine.
  components:
  - type: Tag
    tags:
      - Magazine545
      - MagazineLightRifle
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    soundInsert:
      path: /Audio/_FinalHorizon/Weapons/Guns/Misc/rifle_load.ogg
      params:
        variation: 0.1
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge545
    capacity: 30
    fillDelay: 0.30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Ammunition/Magazine/Rifles/ak74black.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: FHMagazineRifleAK74Black
  id: FHMagazineRifleAK74Bakelite
  name: 6L20 30-Round magazine
  description: A polymer magazine made for the AK-74 rifle. Commonly mistaken to be made out of Bakelite, it is actually made out of a fiberglass polymer called AG-4S.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Ammunition/Magazine/Rifles/ak74bake.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: FHMagazineRifleAK74Black
  id: FHMagazineRifleAK74Bakelite45
  name: 6L18 45-Round magazine
  description: A large polymer magazine made for the RPK-74 rifle. Commonly mistaken to be made out of Bakelite, it is actually made out of a fiberglass polymer called AG-4S.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Ammunition/Magazine/Rifles/ak74bake45.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: BallisticAmmoProvider
    capacity: 45

