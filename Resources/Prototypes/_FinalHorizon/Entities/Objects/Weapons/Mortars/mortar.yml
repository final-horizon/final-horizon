- type: entity
  parent: BaseItem
  id: FHMortarBasic
  name: portable mortar
  description: A support weapon capable of droping bombs on heads from a distance. The target is relative to the mortars position and the dial is relative to the target position. The minimum range is 10 meters and the maximum range is 500 meters.
  components:
    - type: Sprite
      sprite: _FinalHorizon/Objects/Weapons/Mortars/mortar.rsi
      layers:
        - map: ["mortar"]
          state: mortar_carry
    - type: Fixtures
      fixtures:
        fix1:
          shape: !type:PhysShapeAabb
            bounds: "-0.25,-0.25,0.25,0.25"
          density: 20
          mask:
            - ItemMask
          restitution: 0.3
          friction: 0.2
        mortar:
          shape: !type:PhysShapeAabb
            bounds: "-0.49,-0.49,0.49,0.49"
          density: 20
          layer:
            - Impassable
          mask:
            - Impassable
          hard: false
    - type: CollisionWake
      enabled: false
    - type: Anchorable
      flags:
        - Unanchorable
    - type: Item
      size: Huge
    - type: Mortar
      fireDelay: 10
    - type: Damageable
      damageContainer: Inorganic
    - type: UserInterface
      interfaces:
        enum.MortarUiKey.Key:
          type: MortarBui
    - type: ActivatableUI
      key: enum.MortarUiKey.Key
    - type: Appearance
    - type: GenericVisualizer
      visuals:
        enum.MortarVisualLayers.State:
          mortar:
            Item: { state: mortar_carry }
            Deployed: { state: mortar_deploy }
    - type: MeleeSound
      soundGroups:
        Brute:
          path: "/Audio/Effects/metal_break1.ogg"

- type: entity
  parent: BaseItem
  id: FHMortarShellHE
  name: high explosive mortar shell
  description: A mortar shell packed with high explosive. Drop into a mortar tube to activate.
  components:
    - type: Item
      size: Huge
    - type: Sprite
      sprite: _FinalHorizon/Objects/Weapons/Mortars/shells.rsi
      state: he
    - type: MortarShell
    - type: Explosive
      explosionType: FHDefault
      maxIntensity: 40
      intensitySlope: 5
      totalIntensity: 170
      maxTileBreak: 3
      deleteAfterExplosion: true
    - type: ExplosionResistance
      damageCoefficient: 0
      worn: false
    - type: ExplodeOnTrigger # add a chance for this to not go off and for it to become UXO in the future?
      keysIn:
      - mortar
    - type: ProjectileGrenade
      fillPrototype: FHBulletFragment
      capacity: 15
      randomAngle: true
      triggerKey: mortar
