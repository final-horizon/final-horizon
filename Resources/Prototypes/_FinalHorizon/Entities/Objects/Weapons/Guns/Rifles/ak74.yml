- type: entity
  name: AK-74
  parent: FHWeaponBase
  id: FHWeaponRifleAK74
  description: The Soviet military standard issue rifle. Developed in the 1970 due to the adoption of the 5.45x39mm cartridge. It was lated adopted in 1974.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Rifles/ak74.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Huge
    shape:
    - 0,0,3,2
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/Rifles/ak74.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 7
    selectedMode: FullAuto
    availableModes:
      - FullAuto
      - SemiAuto
    soundGunshot:
      path: /Audio/_FinalHorizon/Weapons/Guns/Gunshots/ak74.ogg
      params:
        variation: 0.1
        volume: -2
    soundEmpty:
      path: /Audio/_FinalHorizon/Weapons/Guns/Empty/gen_empty.ogg
  - type: ChamberMagazineAmmoProvider
    soundBoltClosed:
      path: /Audio/_FinalHorizon/Weapons/Guns/Cock/ak74_cock.ogg
      volume: 2
    soundRack:
      path: /Audio/_FinalHorizon/Weapons/Guns/Cock/ak74_cock.ogg
    canActivateInhand: false
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_FinalHorizon/Weapons/Guns/MagIn/ak74_magin.ogg
        ejectSound: /Audio/_FinalHorizon/Weapons/Guns/MagOut/ak74_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine545
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - Cartridge545
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
    appearanceDataInit:
     enum.AmmoVisuals.MagLoaded: false
  - type: FarGunshot
    sound: /Audio/_FinalHorizon/Weapons/Guns/Far/ak_dist.ogg
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_FinalHorizon/Weapons/Guns/Draw/ak74_draw.ogg
      params:
        volume: -2


- type: entity
  name: AK-74 + GP-25
  parent: FHWeaponRifleAK74
  id: FHWeaponRifleAK74GL
  description: The Soviet military standard issue rifle. Developed in the 1970 due to the adoption of the 5.45x39mm cartridge. It was lated adopted in 1974. This one has a GP25 attached.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Rifles/ak74_gl.rsi
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/Rifles/ak74_gl.rsi
  - type: AlternateGun
    switchSound:
      path: /Audio/_FinalHorizon/Weapons/Guns/Deploy/gp25_select.ogg
  - type: ItemSlots
    slots:
      launcher:
        name: Launcher
        priority: 3
        startingItem: FHWeaponUnderBarrelLauncherGP25
        locked: true
      launcher_mag:
        name: LauncherMag
        priority: 4
        insertSound: /Audio/_FinalHorizon/Weapons/Guns/MagIn/gp25_insertgrenade.ogg
        ejectSound: /Audio/_FinalHorizon/Weapons/Guns/MagOut/gp25_openbarrel.ogg
        whitelist:
          tags:
            - CartridgeVOG25
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_FinalHorizon/Weapons/Guns/MagIn/ak74_magin.ogg
        ejectSound: /Audio/_FinalHorizon/Weapons/Guns/MagOut/ak74_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine545
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - Cartridge545
