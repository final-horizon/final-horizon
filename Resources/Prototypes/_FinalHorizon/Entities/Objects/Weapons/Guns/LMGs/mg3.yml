- type: entity
  name: MG3
  parent: FHWeaponBaseLMG
  id: FHWeaponLMGMG3
  description: The Bundeswehr standard issue light machinegun. Adopted in the late 1950s, the MG3 is derived from the MG42, rechambered to fire 7.62x51mm NATO rather than 7.92x57mm Mauser.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/LMGs/mg3.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Huge
    shape:
    - 0,0,3,2
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/LMGs/mg3.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 9
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/_FinalHorizon/Weapons/Guns/Gunshots/mg3.ogg
      params:
        variation: 0.1
        volume: -2
    soundEmpty:
      path: /Audio/_FinalHorizon/Weapons/Guns/Empty/gen_empty.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_FinalHorizon/Weapons/Guns/Cock/m249_charge.ogg
    soundBoltClosed:
      path: /Audio/_FinalHorizon/Weapons/Guns/Close/m249_close.ogg
    soundBoltOpened:
      path: /Audio/_FinalHorizon/Weapons/Guns/Open/m249_open.ogg
    canActivateInhand: false
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_FinalHorizon/Weapons/Guns/MagIn/m249_boxinsert.ogg
        ejectSound: /Audio/_FinalHorizon/Weapons/Guns/MagOut/m249_boxremove.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineBox762x51
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - Cartridge762x51
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
    appearanceDataInit:
     enum.AmmoVisuals.MagLoaded: false
  - type: FarGunshot
    sound: /Audio/_FinalHorizon/Weapons/Guns/Far/m60.ogg
