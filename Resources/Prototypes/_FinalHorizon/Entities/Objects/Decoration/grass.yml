- type: entity
  id: FHGrassTall1
  name: tall grass
  suffix: 1
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  #- type: FloorOccluder # Disabled for now. I should make a dedicated system to mask the top of players sprites to show above the grass sprite similar to how flooroccluder does it
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: _FinalHorizon/Objects/Decoration/Flora/grass_tall.rsi
    drawdepth: Overdoors
    state: 1
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: PlacementReplacement
    key: walls
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
  - type: Damageable
    damageModifierSet: Wood
  - type: Injurable
    damageContainer: StructuralInorganic

