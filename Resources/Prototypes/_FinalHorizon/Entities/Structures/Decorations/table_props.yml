- type: entity
  parent: BaseStructure
  id: FHBaseStructureTableProp
  abstract: true
  components:
  - type: Sprite
    sprite: _FinalHorizon/Structures/Decoration/table_props.rsi
    drawdepth: SmallObjects
    state: icon
  - type: Icon
    sprite: _FinalHorizon/Structures/Decoration/table_props.rsi
    state: icon
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 25
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: FHBaseStructureTableProp
  id: FHStructureTablePropComputer
  name: computer
  description: A brand new computer. Looks expensive.
