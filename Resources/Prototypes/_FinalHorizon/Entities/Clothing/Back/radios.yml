- type: entity
  parent: Clothing
  id: FHClothingBackRadioANPRC77
  name: AN/PRC-77
  components:
  - type: ContainerContainer
    containers:
      key_slots: !type:Container
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeyNato
  - type: Headset
    requiredSlot: back
  - type: EncryptionKeyHolder
    keySlots: 1
  - type: Sprite
    sprite: _FinalHorizon/Clothing/Back/anprc77.rsi
    state: icon
  - type: Item
    size: Large
  - type: Clothing
    slots:
    - back
    sprite: _FinalHorizon/Clothing/Back/anprc77.rsi
  - type: RadioSound
    sound:
      path: /Audio/_FinalHorizon/Effects/radio-beep.ogg
      params:
        volume: -6
        rolloffFactor: 5
        variation: 0.1

