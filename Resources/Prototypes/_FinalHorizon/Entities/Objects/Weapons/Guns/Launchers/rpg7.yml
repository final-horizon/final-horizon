- type: entity
  name: RPG-7
  parent: FHWeaponLauncherBase
  id: FHWeaponLauncherRPG7
  description: The Soviet military standard issue rocket launcher. Designed between 1954-1958 adopted in 1961 to replace the old RPG-2 rocket launcher.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Launchers/rpg7.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/Launchers/rpg7.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item
    size: Ginormous
  - type: Gun
    fireRate: 5
    projectileSpeed: 25
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_FinalHorizon/Weapons/Guns/Gunshots/rpg_fire.ogg
  - type: MultiHandedItem
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeRPG7
    capacity: 1
    soundInsert:
      path: /Audio/_FinalHorizon/Weapons/Guns/magIn/rpgreload.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
