- type: entity
  parent: FHClothingPouchBase
  id: FHClothingPouchUSMCAmmoDump
  name: USMC dump pouch
  description: A pouch for carrying discarded mags.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Clothing/Pouch/usmc_ammo.rsi
  - type: Clothing
    sprite: _FinalHorizon/Clothing/Pouch/usmc_ammo.rsi
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,1,5 # make this have a slower time to pull items out of it

