- type: entity
  parent: BaseItem
  abstract: true
  id: FHWeaponBase
  components:
  - type: Wieldable
  - type: WieldableDoAfter
    timer: 0.4
  - type: GunWieldBonus
    minAngle: -49
    maxAngle: -30
    angleIncrease: 3.5
    angleDecay: 8
  - type: Gun
    minAngle: 50
    maxAngle: 50
    angleIncrease: 3.5
    angleDecay: 3
    soundEmpty:
      path: /Audio/_FinalHorizon/Weapons/Guns/Empty/gen_empty.ogg
  - type: SpeedModifiedOnWield
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: PullDoAfter
    pullTime: 0.6
  - type: Scope
    requireWielding: true
    zoomLevels:
    - zoom: 1.6
      offset: 14
      allowMovement: true
      doAfter: 0.1

- type: entity
  parent: FHWeaponBase
  abstract: true
  id: FHWeaponBaseLMG
  components:
  - type: WieldableDoAfter
    timer: 1
  - type: SpeedModifiedOnWield
    walkModifier: 0.6
    sprintModifier: 0.6
  - type: PullDoAfter
    pullTime: 1

- type: entity
  parent: BaseItem
  id: FHWeaponLauncherBase
  components:
  - type: HeldSpeedModifier
    walkModifier: 0.757
    sprintModifier: 0.6
  - type: PullDoAfter
    pullTime: 2
