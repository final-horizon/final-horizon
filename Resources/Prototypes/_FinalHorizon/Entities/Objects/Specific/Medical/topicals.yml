- type: entity
  parent: BaseItem
  id: FHBaseHealingItem
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/medical.rsi
  - type: Item
    size: Small
    sprite: Objects/Specific/Medical/medical.rsi
    heldPrefix: ointment
  # Inherited
  - type: StaticPrice
    price: 0
  - type: Tag
    tags:
    - FHMedical

- type: entity
  name: ointment
  description: Used to treat those nasty burns. Less effective on caustic burns.
  parent: FHBaseHealingItem
  id: FHOintment
  suffix: Full
  components:
  - type: Tag
    tags:
    - Ointment
    - FHMedical
  - type: Sprite
    state: ointment
  - type: Item
    heldPrefix: ointment
    storedSprite:
      state: ointment-storage
      sprite: Objects/Specific/Medical/medical.rsi
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Heat: -10 # FH
        Cold: -10 # FH
        Shock: -10 # FH
        Caustic: -10 # FH
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: FHOintment
    count: 10
  - type: StackPrice
    price: 5

- type: entity
  id: FHOintment1
  parent: FHOintment
  suffix: Single
  components:
  - type: Stack
    stackType: FHOintment
    count: 1

