- type: entity
  id: FHRandomFloraSpawnerBase
  parent: MarkerBase
  name: flora spawner
  components:
  - type: Sprite
    sprite: _FinalHorizon/Markers/flora_spawners.rsi
    state: 1
  - type: PlacementReplacement
    key: walls

# temperate
- type: entity
  id: FHRandomFloraSpawnerTemperate
  suffix: temperate trees very light
  parent: FHRandomFloraSpawnerBase
  components:
  - type: Sprite
    state: 1
  - type: MappingSpawner
    table: !type:GroupSelector
      children:
      - !type:GroupSelector
        prob: 0.05
        children:
        - id: FHMineClaymoreActive
        - id: FHTMineM16APMActive
        - id: FHMineOZM72Active
        - id: FHMinePFM-1Active
        - id: FHMinePMN-1Active
        - id: FHMineStick
      - !type:GroupSelector
        prob: 0.03
        children:
        - id: FHTreeDeadTemperate1
        - id: FHTreeDeadTemperate2
        - id: FHTreeTall1
        - id: FHTreeTall2
        - id: FHTreeTall3
      - !type:GroupSelector
        prob: 0.8
        children:
        - id: FHDecalSpawnerRockTemperate
      - !type:GroupSelector
        prob: 0.80
        children:
        - id: FHDecalSpawnerGrassTemperate

