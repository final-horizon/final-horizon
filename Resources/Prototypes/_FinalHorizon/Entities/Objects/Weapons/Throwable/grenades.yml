- type: entity
  name: F1 grenade
  description: an older frag grenade of the soviet army
  parent: TimerGrenadeBase
  id: FHGrenadeF1
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Grenades/f1.rsi
  - type: TimerTriggerVisuals
    primingSound:
      path: /Audio/Effects/chopstickbreak.ogg
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: FHDefault
    maxIntensity: 10
    intensitySlope: 3
    totalIntensity: 50
    maxTileBreak: 3
  - type: ProjectileGrenade
    fillPrototype: FHBulletFragment
    capacity: 8
    randomAngle: true
    triggerKey: timer
  - type: TimerTrigger
    delay: 3.5

