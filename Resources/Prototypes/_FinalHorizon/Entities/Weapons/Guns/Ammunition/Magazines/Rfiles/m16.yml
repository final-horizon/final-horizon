- type: entity
  parent: BaseItem
  id: FHMagazineRifleM16
  name: M16 Magazine (30)
  components:
  - type: Tag
    tags:
      - Magazine556
      - MagazineLightRifle
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge556
    capacity: 30
    fillDelay: 0.30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Ammunition/Magazine/Rifles/m16.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
