- type: entity
  parent: SolutionTile
  id: FHFloorWaterEntityDeep
  name: deep water
  description: A real thirst quencher. This one is impassable.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: FloorOccluder
  - type: Transform
    anchored: true
  - type: SyncSprite
  - type: Clickable
  - type: Sprite
    sprite: _FinalHorizon/Tiles/Natural/water.rsi
    drawdepth: BelowFloor
    layers:
      - state: deep_water
  - type: Solution
    id: pool
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 7680
  - type: SolutionRegeneration
    solution: pool
    generated:
      reagents:
      - ReagentId: Water
        Quantity: 100
  - type: DrainableSolution
    solution: pool
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: PlacementReplacement # FH
    key: water-tiles # FH
