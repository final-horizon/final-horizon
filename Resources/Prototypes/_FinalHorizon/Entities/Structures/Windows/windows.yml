- type: entity
  id: FHWindow
  parent: Window
  name: window
  description: Don't smudge up the glass down there.
  components:
  - type: Sprite
    drawdepth: WallTops
    sprite: _FinalHorizon/Structures/Windows/window.rsi
  - type: Icon
    sprite: _FinalHorizon/Structures/Windows/window.rsi
    state: full
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          GlassBulletImpact
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
