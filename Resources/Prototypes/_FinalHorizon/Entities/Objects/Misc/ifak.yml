- type: entity
  parent: BaseStorageItem
  id: IFAKBase
  abstract: true
  description: An individual first aid kit
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Storage/ifak.rsi
    state: usmc
  - type: Item
    sprite: _FinalHorizon/Objects/Storage/ifak.rsi
    state: usmc
    size: Small
    shape:
    - 0,0,2,2
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,1
  - type: ContainerContainer
    containers:
      storagebase: !type:Container

- type: entity
  parent: IFAKBase
  id: IFAKBaseFilled
  suffix: Filled
  abstract: true
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Brutepack
        - id: Gauze
        - id: PillCanisterTricordrazine
        - id: PillCanisterIron

