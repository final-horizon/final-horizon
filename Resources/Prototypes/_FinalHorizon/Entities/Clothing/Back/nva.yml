- type: entity
  parent: FHClothingBackpackBase
  id: FHClothingBackpackNVAKit
  name: Nationale Volksarmee Backpack
  description: The standard backpack in the Nationale Volksarmee.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Clothing/Back/nva_bag.rsi
  - type: Storage
    grid:
    - 0,0,3,3
    maxItemSize: Large

- type: entity
  parent: FHClothingBackpackNVAKit
  id: FHClothingBackpackNVAKitMachineGunnerFilled
  suffix: filled, machinegunner
  components:
