- type: entity
  id: FHBrustwehr
  parent: BaseStructure
  name: brustwehr
  description: A mound of dirt used for cover in combat.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Structures/Cover/brustwehr.rsi
  - type: Icon
    sprite: _FinalHorizon/Structures/Cover/brustwehr.rsi
    state: full
  - type: Animateable
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 1000
        mask:
        - TableMask
        layer:
        - TableLayer
        - BulletImpassable
  - type: IconSmooth
    key: brustwehr
    base: brustwehr
  - type: Climbable
    delay: 2
  - type: Clickable
  - type: Tag
    tags:
    - ForceFixRotations
  - type: Cover
    hitChance: 0.80
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.4
    sprintSpeedModifier: 0.4
  - type: Construction
    graph: Brustwehr
    node: built



