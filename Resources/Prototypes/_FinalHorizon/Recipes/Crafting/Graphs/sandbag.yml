- type: constructionGraph
  id: SandbagItem
  start: empty
  graph:
    - node: empty
      edges:
        - to: full
          steps:
            - material: Dirt
              amount: 1
              doAfter: 1
    - node: full
      entity: MaterialSandbagFull

- type: constructionGraph
  id: SandbagCover
  start: start
  graph:
    - node: start
      edges:
        - to: incomplete
          steps:
            - tag: SandbagItemFull
              amount: 1
              doAfter: 1
    - node: incomplete
      entity: FHSandbagCoverIncomplete
      edges:
        - to: built
          steps:
            - tag: SandbagItemFull
              amount: 1
              doAfter: 1
    - node: built
      entity: FHSandbagCover
