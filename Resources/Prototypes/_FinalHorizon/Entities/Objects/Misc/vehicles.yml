#nato

- type: entity
  id: FHVehicleHumvee
  parent: BaseStructure
  name: Humvee
  description: use the door
  components:
  - type: Appearance
  - type: Sprite
    sprite: _FinalHorizon/Objects/Vehicles/Humvee.rsi
    state: state1
    drawdepth: OverMobs
  - type: Icon
    sprite: _FinalHorizon/Objects/Vehicles/Humvee.rsi
    state: state1
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Climbable
    delay: 1.5
  - type: Clickable
  - type: Cover
    hitChance: 0.40
  - type: Fixtures
    fixtures:
      front:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,0.5,0.6,1.5"
        density: 200
        hard: true
        layer:
        - WallLayer
        - BulletImpassable
        mask:
        - TableMask
      rear:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.6,-1.5,0.6,-0.5"
        density: 200
        hard: true
        layer:
        - WallLayer
        - BulletImpassable
        mask:
        - TableMask
      middle:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.3,-0.5,0.3,0.5"
        density: 100
        hard: true
        layer:
        - WallLayer
        - BulletImpassable
        mask:
        - TableMask
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MetalBulletImpact
    soundTypes:
      Heat:
        collection:
          MetalLaserImpact


