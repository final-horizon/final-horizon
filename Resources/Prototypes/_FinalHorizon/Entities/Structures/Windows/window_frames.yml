- type: entity
  id: FHWindowFrameWood
  parent: BaseStructure
  name: wood window frame
  description: A window frame.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Structures/WindowFrames/wood.rsi
    state: base
  - type: Icon
    sprite: _FinalHorizon/Structures/WindowFrames/wood.rsi
    state: base
  - type: Damageable
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - ItemMask
        layer:
        - SlipLayer
  - type: SunShadowCast
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.6
    sprintSpeedModifier: 0.6

