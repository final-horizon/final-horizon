- type: entity
  parent: BaseItem
  abstract: true
  id: FHWeaponBase
  components:
  - type: Wieldable
  - type: WieldableDoAfter
    timer: 0.4
  - type: GunWieldBonus
    minAngle: -48
    maxAngle: -44
    angleIncrease: 0
    angleDecay: 0
  - type: Gun
    minAngle: 50
    maxAngle: 50
    angleIncrease: 2.5
    angleDecay: 8
    soundEmpty:
      path: /Audio/_FinalHorizon/Weapons/Guns/Empty/gen_empty.ogg
  - type: SpeedModifiedOnWield
    walkModifier: 0.80
    sprintModifier: 0.80
  - type: PullDoAfter
    pullTime: 0.6
  - type: Scope
    requireWielding: true
    zoomLevels:
    - zoom: 1.7
      offset: 6
      allowMovement: true
      doAfter: 0.1
  - type: FarGunshot
    range: 120
    sound: /Audio/_FinalHorizon/Weapons/Guns/Far/ak74.ogg

- type: entity
  parent: FHWeaponBase
  abstract: true
