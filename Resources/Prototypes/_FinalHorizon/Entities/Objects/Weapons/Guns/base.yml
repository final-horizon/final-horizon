- type: entity
  parent: BaseItem
  abstract: true
  id: FHWeaponBase
  components:
  - type: Wieldable
  - type: WieldableDoAfter
    timer: 0.4
  - type: GunWieldBonus
    minAngle: -47
    maxAngle: -38
    angleIncrease: 0
    angleDecay: 0
  - type: Gun
    minAngle: 50
    maxAngle: 50
    angleIncrease: 2.5
    angleDecay: 8
    soundEmpty:
      path: /Audio/_FinalHorizon/Weapons/Guns/Empty/gen_empty.ogg
  - type: SpeedModifiedOnWield
    walkModifier: 0.73
    sprintModifier: 0.73
  - type: PullDoAfter
    pullTime: 0.6
  - type: Scope
    requireWielding: true
    zoomLevels:
    - zoom: 1.4
      offset: 13
      allowMovement: true
      doAfter: 0.1
  - type: FarGunshot
    range: 260
    sound: /Audio/_FinalHorizon/Weapons/Guns/Far/ak_dist.ogg

- type: entity
