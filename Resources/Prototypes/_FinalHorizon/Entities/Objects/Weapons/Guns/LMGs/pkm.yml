- type: entity
  name: PKM
  parent: FHWeaponBaseLMG
  id: FHWeaponLMGPKM
  description: The Soviet military standard issue machine gun. Developed and adopted in 1969 it is a modernized version of the older and heavier PK machine gun.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/LMGs/pkm.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Huge
    shape:
    - 0,0,3,2
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/LMGs/pkm.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 7
    selectedMode: FullAuto
    availableModes:
      - FullAuto
    soundGunshot:
      path: /Audio/_FinalHorizon/Weapons/Guns/Gunshots/pkm.ogg
      params:
        variation: 0.1
        volume: -2
    soundEmpty:
      path: /Audio/_FinalHorizon/Weapons/Guns/Empty/gen_empty.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_FinalHorizon/Weapons/Guns/Cock/m249_charge.ogg
    soundBoltClosed:
      path: /Audio/_FinalHorizon/Weapons/Guns/Close/m249_close.ogg
    soundBoltOpened:
      path: /Audio/_FinalHorizon/Weapons/Guns/Open/m249_open.ogg
    canActivateInhand: false
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_FinalHorizon/Weapons/Guns/MagIn/m249_boxinsert.ogg
        ejectSound: /Audio/_FinalHorizon/Weapons/Guns/MagOut/m249_boxremove.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineBox762x54
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - Cartridge762x54
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
    appearanceDataInit:
     enum.AmmoVisuals.MagLoaded: false
