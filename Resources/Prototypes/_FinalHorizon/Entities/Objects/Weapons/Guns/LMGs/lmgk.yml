- type: entity
  name: LMGK
  parent: FHWeaponBase
  id: FHWeaponLMGLMGK
  description: The Nationale Volksarmee standard issue squad automatic weapon. The LMGK is a licensed RPK, featuring a longer barrel, thicker receiver and different stock. Features polymer furniture, rather than wood.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/LMGs/lmgk.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Huge
    shape:
    - 0,0,3,2
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/LMGs/lmgk.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 7.2
    angleIncrease: 1.5
    selectedMode: FullAuto
    availableModes:
      - FullAuto
      - SemiAuto
    soundGunshot:
      path: /Audio/_FinalHorizon/Weapons/Guns/Gunshots/ak74.ogg
      params:
        variation: 0.1
        volume: -2
    soundEmpty:
      path: /Audio/_FinalHorizon/Weapons/Guns/Empty/gen_empty.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
    canActivateInhand: false
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_FinalHorizon/Weapons/Guns/MagIn/ak74_magin.ogg
        ejectSound: /Audio/_FinalHorizon/Weapons/Guns/MagOut/ak74_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine762x39
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - Cartridge762x39
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
    appearanceDataInit:
     enum.AmmoVisuals.MagLoaded: false
  - type: GunWieldBonus
    minAngle: -45
    maxAngle: -43
  - type: Scope
    requireWielding: true
    zoomLevels:
    - zoom: 1.8
      offset: 13
      allowMovement: true
      doAfter: 0.15
  - type: SpeedModifiedOnWield
    walkModifier: 0.6
    sprintModifier: 0.6
  - type: WieldableDoAfter
    timer: 0.6
  - type: FarGunshot
    sound: /Audio/_FinalHorizon/Weapons/Guns/Far/ak74.ogg
