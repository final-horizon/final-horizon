- type: entity
  parent: BaseWall
  id: FHWallTent
  name: tent wall
  components:
  - type: Sprite
    sprite: _FinalHorizon/Structures/Walls/tent.rsi
    color: "#5a7252"
  - type: Icon
    sprite: _FinalHorizon/Structures/Walls/tent.rsi
    color: "#5a7252"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: tent
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          WoodBulletImpact

