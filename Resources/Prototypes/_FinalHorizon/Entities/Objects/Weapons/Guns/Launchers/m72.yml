- type: entity
  name: M-72 LAW
  parent: FHWeaponLauncherBase
  id: FHWeaponLauncherM72
  description: The standard light disposable anti-tank weapon of the USMC, must be deployed to use
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Launchers/m72.rsi
    layers:
      - state: base
        map: [unfoldedLayer]
      - state: folded
        map: [foldedLayer]
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/Launchers/m72.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item
    size: Ginormous
  - type: Gun
    fireRate: 5
    projectileSpeed: 25
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_FinalHorizon/Weapons/Guns/Gunshots/m72.ogg
  - type: BallisticAmmoProvider
    mayTransfer: false
    cycleable: false
    proto: FHBulletRocketM72
    capacity: 1
  - type: Appearance
  - type: FoldableGun
    folded: true
    foldTime: 7
    foldSound:
      path: /Audio/_FinalHorizon/Weapons/Guns/Deploy/law_deploy.ogg
  - type: MultiHandedItem
  - type: GenericVisualizer
    visuals:
      enum.FoldedGunVisuals.State:
        foldedLayer:
          True: {visible: true}
          False: {visible: false}
        unfoldedLayer:
          True: {visible: false}
          False: {visible: true}
  - type: FarGunshot
    range: 180
