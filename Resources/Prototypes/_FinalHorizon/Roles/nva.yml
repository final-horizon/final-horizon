  playTimeTracker: NVAPlatoonLeader
  startingGear: NVAUniformPlatoonLeader
  icon: "NVAPlatoonLeader"
  whitelisted: true
  joinNotifiyCrew: false
  displayWeight: 10
  special:
  - !type:AddComponentSpecial
    components:
      - type: Fixtures
        fixtures:
          fix1:
