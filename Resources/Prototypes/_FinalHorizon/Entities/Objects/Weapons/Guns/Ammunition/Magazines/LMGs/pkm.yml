- type: entity
  parent: BaseItem
  id: FHMagazineLMGPKM
  name: PKM Box (100)
  components:
  - type: Tag
    tags:
      - MagazineBox762x54
      - MagazineLightRifleBox
  - type: Item
    size: Normal
  - type: BallisticAmmoProvider
    soundInsert:
      path: /Audio/_FinalHorizon/Weapons/Guns/Misc/rifle_load.ogg
      params:
        variation: 0.1
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge762x54
    capacity: 100
    fillDelay: 0.30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Ammunition/Magazine/LMGs/pkm.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: FHMagazineLMGPKM
  id: FHMagazineLMGPKMFull
  suffix: Full
  components:
  - type: BallisticAmmoProvider
    proto: FHCartridge762x54
