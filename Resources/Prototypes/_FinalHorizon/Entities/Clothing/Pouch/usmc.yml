- type: entity
  parent: FHClothingPouchBase
  id: FHClothingPouchUSMCAmmo
  name: USMC ammo pouch
  description: A pouch that can carry three mags.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Clothing/Pouch/usmc_ammo.rsi
  - type: Clothing
    sprite: _FinalHorizon/Clothing/Pouch/usmc_ammo.rsi
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,1
    whitelist:
      tags:
      - MagazineLightRifle

