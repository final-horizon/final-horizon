- type: entity
  parent: FHClothingPouchBase
  id: FHIFAKBase
  abstract: true
  description: An individual first aid kit
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Storage/ifak.rsi
    state: usmc
  - type: Item
    sprite: _FinalHorizon/Objects/Storage/ifak.rsi
    state: usmc
    size: Small
    shape:
    - 0,0,2,2
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,1
    whitelist:
      tags:
      - FHMedical
  - type: ContainerContainer
    containers:
      storagebase: !type:Container


# USMC
- type: entity
  parent: FHIFAKBase
  id: FHIFAKUSMC
  name: USMC IFAK
  components:
  - type: Sprite
    state: usmc
  - type: Item
    state: usmc

- type: entity
  parent: FHIFAKUSMC
  id: FHIFAKUSMCFilled
  name: USMC IFAK
  suffix: Filled
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: FHGauzePacketNATO
        - id: BlisterPackTricordrazine
        - id: BlisterPackIron
        - id: FHBrutepack

