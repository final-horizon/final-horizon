- type: entity
  name: G3SG/1
  parent: FHWeaponBaseSniper
  id: FHWeaponSnipersG3SG1
  description: A variation of the standard G3A3, with a few modifications to transform it into a marksman rifle. Essentially a G3A3 with a scope and a higher cheek rest.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Snipers/g3sg1.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Huge
    shape:
    - 0,0,3,2
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/Snipers/g3sg1.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
    soundGunshot:
      path: /Audio/_FinalHorizon/Weapons/Guns/Gunshots/g3a3.ogg
      params:
        variation: 0.1
        volume: -2
    soundEmpty:
      path: /Audio/_FinalHorizon/Weapons/Guns/Empty/gen_empty.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/_FinalHorizon/Weapons/Guns/Cock/g3_boltpull.ogg
    canActivateInhand: false
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_FinalHorizon/Weapons/Guns/MagIn/g3_magin.ogg
        ejectSound: /Audio/_FinalHorizon/Weapons/Guns/MagOut/g3_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine762x51
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - Cartridge762x51
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
    appearanceDataInit:
     enum.AmmoVisuals.MagLoaded: false
  - type: FarGunshot
    sound: /Audio/_FinalHorizon/Weapons/Guns/Far/toz194_dist.ogg
