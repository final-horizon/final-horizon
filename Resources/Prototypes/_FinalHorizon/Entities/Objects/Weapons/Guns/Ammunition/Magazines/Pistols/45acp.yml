- type: entity
  parent: BaseItem
  id: FHMagazinePistol45acpMag
  name: .45 ACP Pistol Magazine
  description:
  components:
  - type: Tag
    tags:
      - Magazine45acp
      - MagazinePistol
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    soundInsert:
      path: /Audio/_FinalHorizon/Weapons/Guns/Misc/rifle_load.ogg
      params:
        variation: 0.1
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge45acp
    capacity: 8
    fillDelay: 0.30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Ammunition/Magazine/Pistol/45acpMag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 7
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: FHMagazinePistol45acpMag
  id: FHMagazineRiflePistol45acpMagfull
  suffix: Full
  components:
  - type: BallisticAmmoProvider
    proto: FHCartridge45acp
