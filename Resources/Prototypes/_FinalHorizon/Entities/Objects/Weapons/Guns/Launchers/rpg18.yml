- type: entity
  name: RPG-18
  parent: FHWeaponLauncherBase
  id: FHWeaponLauncherRPG18
  description: The Soviet military standard issue disposable rocket launcher. Designed and adopted in 1972 to give anti-tank capabilities to standard riflemen.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Launchers/rpg18.rsi
    layers:
      - state: base
        map: [unfoldedLayer]
      - state: folded
        map: [foldedLayer]
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/Launchers/rpg18.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item
    size: Ginormous
  - type: Gun
    fireRate: 5
    projectileSpeed: 25
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_FinalHorizon/Weapons/Guns/Gunshots/rpg22.ogg
  - type: BallisticAmmoProvider
    mayTransfer: false
    cycleable: false
    proto: FHBulletRocketRPG18
    capacity: 1
  - type: Appearance
  - type: FoldableGun
    folded: true
    foldTime: 6
    foldSound:
      path: /Audio/_FinalHorizon/Weapons/Guns/Deploy/rpgoneuse_deploying.ogg
  - type: MultiHandedItem
  - type: GenericVisualizer
    visuals:
      enum.FoldedGunVisuals.State:
        foldedLayer:
          True: {visible: true}
          False: {visible: false}
        unfoldedLayer:
          True: {visible: false}
          False: {visible: true}
  - type: FarGunshot
    range: 200
