- type: entity
  parent: FHClothingOuterArmorBase
  id: FHClothingOuterArmorFlak
  name: M69 Flak Vest
  description: An aging flak vest still in use by the USMC. Not very effective against rifle rounds.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Clothing/OuterClothing/Vests/flak.rsi
  - type: Clothing
    sprite: _FinalHorizon/Clothing/OuterClothing/Vests/flak.rsi

- type: entity
  parent: FHClothingOuterArmorBase
  id: FHClothingOuterArmorPASGT
  name: PASGT Vest
  description: The Personnel Armor System for Ground Troops vest is a newer piece of kit received in small numbers by USMC forces fighting throughout Europe, its a slight upgrade to the aging M69. Not very effective against rifle rounds.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Clothing/OuterClothing/Vests/pasgt.rsi
  - type: Clothing
    sprite: _FinalHorizon/Clothing/OuterClothing/Vests/pasgt.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.70

- type: entity
  parent: FHClothingOuterArmorBase
  id: FHClothingOuterArmor6b2
  name: 6B2 Vest
  description: The standard issue protective vest of the Soviet Army. Not very effective against rifle rounds.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Clothing/OuterClothing/Vests/6b2.rsi
  - type: Clothing
    sprite: _FinalHorizon/Clothing/OuterClothing/Vests/6b2.rsi

- type: entity
  parent: [FHClothingOuterArmorBase, FHClothingPouchBase]
  id: FHClothingOuterArmor6b2Lifchik
  name: 6B2 Lifchik Vest
  description: The standard issue protective vest of the Soviet Army. Not very effective against rifle rounds. Has a lifchik chestrig attached for easy access to ammo.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Clothing/OuterClothing/Vests/6b2_lifchik.rsi
  - type: Clothing
    sprite: _FinalHorizon/Clothing/OuterClothing/Vests/6b2_lifchik.rsi
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,1
    whitelist:
      tags:
      - MagazineLightRifle

- type: entity
  parent: [FHClothingOuterArmorBase, FHClothingPouchBase]
  id: FHClothingOuterArmorLifchik
  name: Lifchik Rig
  description: A modern addition to the Soviet Army's arsenal. Allows easy access to AK-74 magazines. Probably can't wear webbing on top of this.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Clothing/OuterClothing/Vests/lifchik.rsi
  - type: Clothing
    sprite: _FinalHorizon/Clothing/OuterClothing/Vests/lifchik.rsi
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,1
    whitelist:
      tags:
      - MagazineLightRifle
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface


- type: entity
  parent: [FHClothingOuterArmorBase, FHClothingPouchBase]
  id: FHClothingOuterArmor6b3
  name: 6B3 Vest
  description: An armored vest designed to replace the 6B2. Promises higher ballistic protection and integrated magazine pouches. Only delivers on one of those.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Clothing/OuterClothing/Vests/6b3.rsi
  - type: Clothing
    sprite: _FinalHorizon/Clothing/OuterClothing/Vests/6b3.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.70
  - type: Storage
    maxItemSize: Small
    grid:
    - 0,0,2,1
    whitelist:
      tags:
      - MagazineLightRifle
