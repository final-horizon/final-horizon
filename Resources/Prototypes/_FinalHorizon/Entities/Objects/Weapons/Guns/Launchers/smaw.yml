- type: entity
  name: MK-153
  parent: FHWeaponLauncherBase
  id: FHWeaponLauncherSMAW
  description: The US military standard issue rocket launcher. Designed in 1980 and adopted in 1984 by the USMC. The Mk-153 Shoulder-Launcher Multipurpose Assault Weapon commonly referred as the SMAW, is a multi-role rocket launcher used by the USMC.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Launchers/smaw.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/Launchers/smaw.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Item
    size: Ginormous
  - type: Gun
    fireRate: 5
    projectileSpeed: 25
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_FinalHorizon/Weapons/Guns/Gunshots/rpg_fire.ogg
  - type: MultiHandedItem
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - CartridgeSMAW
    capacity: 1
    soundInsert:
      path: /Audio/_FinalHorizon/Weapons/Guns/magIn/rpgreload.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: FarGunshot
    range: 240
