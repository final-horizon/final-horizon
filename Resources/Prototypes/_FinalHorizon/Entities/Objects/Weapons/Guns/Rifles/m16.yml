- type: entity
  name: M16A1
  parent: FHWeaponBase
  id: FHWeaponRifleM16A1
  description: The US military standard issue rifle. In 1967 the M16A1 was derived from the M16 to fix jamming, corrosion and a lack of chrome barrel lining, officialy becoming the standard issue in 1969.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Rifles/m16a1.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Huge
    shape:
    - 0,0,3,2
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/Rifles/m16a1.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 8
    burstFireRate: 8
    burstCooldown: 0.2
    selectedMode: FullAuto
    availableModes:
      - FullAuto
      - SemiAuto
    soundGunshot:
      path: /Audio/_FinalHorizon/Weapons/Guns/Gunshots/m16.ogg
      params:
        variation: 0.1
        volume: -2
    soundEmpty:
      path: /Audio/_FinalHorizon/Weapons/Guns/Empty/gen_empty.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
    soundBoltClosed:
      path: /Audio/_FinalHorizon/Weapons/Guns/Cock/m16_chargeback.ogg
      volume: 2
    canActivateInhand: false
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_FinalHorizon/Weapons/Guns/MagIn/m16_magin.ogg
        ejectSound: /Audio/_FinalHorizon/Weapons/Guns/MagOut/m16_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine556
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - Cartridge556
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
    appearanceDataInit:
     enum.AmmoVisuals.MagLoaded: false
  - type: FarGunshot
    sound: /Audio/_FinalHorizon/Weapons/Guns/Far/m16_dist.ogg

- type: entity
  name: M16A2
  parent: FHWeaponRifleM16A1
  id: FHWeaponRifleM16A2
  description: The US military standard issue rifle. The M16A2 was derived from the M16A1 in 1982 and adopted by the USMC in 1983. The M16A2 features improved ergonomics, a burst instead of full-auto and a new barrel with a 1 in 7 twist to fire the new heavier M855 cartridge.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Rifles/m16a2.rsi
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/Rifles/m16a2.rsi
  - type: Gun
    selectedMode: Burst
    availableModes:
      - Burst
      - SemiAuto

- type: entity
  name: M16A2 + M203
  parent: FHWeaponRifleM16A2
  id: FHWeaponRifleM16A2GL
  description: The US military standard issue rifle. The M16A2 was derived from the M16A1 in 1982 and adopted by the USMC in 1983. The M16A2 features improved ergonomics, a burst instead of full-auto and a new barrel with a 1 in 7 twist to fire the new heavier M855 cartridge. This one has an M203 UGL attached.
  components:
  - type: Sprite
    sprite: _FinalHorizon/Objects/Weapons/Guns/Rifles/m16a2_gl.rsi
  - type: Clothing
    sprite: _FinalHorizon/Objects/Weapons/Guns/Rifles/m16a2_gl.rsi
  - type: AlternateGun
    switchSound:
      path: /Audio/_FinalHorizon/Weapons/Guns/Deploy/m203_select.ogg
  - type: ItemSlots
    slots:
      launcher:
        name: Launcher
        priority: 3
        startingItem: FHWeaponUnderBarrelLauncherM203
        locked: true
      launcher_mag:
        name: LauncherMag
        priority: 4
        insertSound: /Audio/_FinalHorizon/Weapons/Guns/MagIn/m203_insertgrenade.ogg
        ejectSound: /Audio/_FinalHorizon/Weapons/Guns/MagOut/m203_openbarrel.ogg
        whitelist:
          tags:
            - CartridgeM406
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_FinalHorizon/Weapons/Guns/MagIn/m16_magin.ogg
        ejectSound: /Audio/_FinalHorizon/Weapons/Guns/MagOut/m16_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine556
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        priority: 1
        whitelist:
          tags:
            - Cartridge556
